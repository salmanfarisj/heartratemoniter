name: pulsex
description: "PulseX — Heart Rate Monitor & Activity Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  # Navigation
  go_router: ^14.6.2
  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  # UI
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  # Bluetooth
  flutter_blue_plus: ^1.32.0
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/pulsex_app_icon.png
    - assets/icons/pulsex_app_icon_foreground.png
